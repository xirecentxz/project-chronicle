<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Universal Code Generator</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#F6F4EE; --surface:#FFFFFF; --ink:#1C1C1A; --ink-muted:#75726A;
    --border:#DEDACD; --accent:#1F7A4D; --accent-hover:#175C3A; --accent-ink:#FFFFFF;
    --error:#B3261E;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#15171A; --surface:#1E2124; --ink:#ECEBE7; --ink-muted:#9A978F;
      --border:#33373A; --accent:#33B074; --accent-hover:#2C9463; --accent-ink:#0B0B0B;
      --error:#FF6B5E;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15171A; --surface:#1E2124; --ink:#ECEBE7; --ink-muted:#9A978F;
    --border:#33373A; --accent:#33B074; --accent-hover:#2C9463; --accent-ink:#0B0B0B;
    --error:#FF6B5E;
  }
  *,*::before,*::after{ box-sizing:inherit; }
  html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
  body{
    height:100%; margin:0; padding:20px; display:flex; justify-content:center; align-items:center;
    background:var(--bg); color:var(--ink);
    font-family:'Space Grotesk',system-ui,sans-serif;
  }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .card{
    width:100%; max-width:410px; background:var(--surface); border:1px solid var(--border);
    border-radius:18px; padding:2rem; box-shadow:0 1px 2px rgba(20,20,15,.05),0 16px 32px -12px rgba(20,20,15,.18);
  }
  h1{ margin:0 0 4px; font-size:1.5rem; font-weight:700; letter-spacing:-0.01em; }
  .subtitle{ margin:0 0 1.5rem; color:var(--ink-muted); font-size:0.92rem; line-height:1.45; }
  .type-toggle{ display:flex; gap:4px; background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:4px; margin-bottom:1.3rem; }
  .type-toggle button{
    flex:1; border:none; background:transparent; padding:9px 10px; border-radius:999px;
    font-family:inherit; font-size:0.92rem; font-weight:600; color:var(--ink-muted); cursor:pointer;
    transition:background-color .18s ease,color .18s ease;
  }
  .type-toggle button.active{ background:var(--accent); color:var(--accent-ink); }
  .form-group{ margin-bottom:1.1rem; text-align:left; }
  label{ display:block; margin-bottom:6px; font-weight:600; font-size:0.85rem; color:var(--ink-muted); }
  input[type="text"]{
    width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:10px;
    font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:0.95rem; color:var(--ink);
    background:var(--bg); outline:none; transition:border-color .15s ease;
  }
  input[type="text"]:focus{ border-color:var(--accent); }
  .btn{ width:100%; padding:13px; border:none; border-radius:10px; font-family:inherit; font-size:1rem; font-weight:600; cursor:pointer; transition:background-color .15s ease,transform .05s ease,border-color .15s ease,color .15s ease; }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-secondary{ background:transparent; border:1.5px solid var(--border); color:var(--ink); margin-top:12px; }
  .btn-secondary:hover{ border-color:var(--accent); color:var(--accent); }
  .hidden{ display:none !important; }
  .error-text{ color:var(--error); font-size:0.85rem; margin:8px 2px 0; }
  .result-panel{
    margin-top:1.4rem; background:#FFFFFF; border:1.5px dashed #C9C5B8; border-radius:12px;
    min-height:170px; padding:18px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; overflow:hidden;
  }
  .placeholder{ display:flex; flex-direction:column; align-items:center; gap:10px; color:#B9B6AA; }
  .placeholder span{ font-size:0.85rem; color:#A9A69B; }
  #barcodeCanvas{ max-width:100%; height:auto !important; }
  #qrContainer{ display:flex; justify-content:center; align-items:center; }
  #qrContainer img,#qrContainer canvas{ max-width:100%; height:auto; }
  .encoded-value{
    font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:0.78rem; color:#8A8779;
    word-break:break-all; text-align:center; max-width:100%;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Universal Code Generator</h1>
    <p class="subtitle">Ubah teks jadi barcode atau QR code yang siap discan.</p>

    <div class="type-toggle">
      <button type="button" class="active" onclick="selectType('barcode', this)">Barcode</button>
      <button type="button" onclick="selectType('qrcode', this)">QR Code</button>
    </div>

    <div class="form-group">
      <label for="inputValue">Data</label>
      <input type="text" id="inputValue" enterkeyhint="go" placeholder="Contoh: https://situsku.com atau SN-00231" oninput="resetOutput()" />
    </div>

    <button class="btn btn-primary" onclick="generateCode()">Generate</button>
    <p id="errorMsg" class="error-text hidden" role="alert"></p>

    <div class="result-panel">
      <div id="placeholder" class="placeholder">
        <svg width="52" height="32" viewBox="0 0 52 32" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="3" height="32"/><rect x="6" y="0" width="1.5" height="32"/>
          <rect x="10" y="0" width="4" height="32"/><rect x="17" y="0" width="2" height="32"/>
          <rect x="22" y="0" width="1.5" height="32"/><rect x="26" y="0" width="3" height="32"/>
          <rect x="32" y="0" width="2" height="32"/><rect x="37" y="0" width="4" height="32"/>
          <rect x="44" y="0" width="1.5" height="32"/><rect x="48" y="0" width="3" height="32"/>
        </svg>
        <span>Hasil kode akan muncul di sini</span>
      </div>
      <canvas id="barcodeCanvas" class="hidden"></canvas>
      <div id="qrContainer" class="hidden"></div>
      <div id="encodedCaption" class="encoded-value hidden"></div>
    </div>

    <button id="downloadBtn" class="btn btn-secondary hidden" onclick="downloadCode()">Download PNG</button>
  </div>

<script>
  let currentType = 'barcode';

  function selectType(type, btn){
    currentType = type;
    document.querySelectorAll('.type-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    resetOutput();
  }

  function showError(msg){
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  function clearError(){
    document.getElementById('errorMsg').classList.add('hidden');
  }

  function resetOutput(){
    clearError();
    document.getElementById('placeholder').classList.remove('hidden');
    document.getElementById('barcodeCanvas').classList.add('hidden');
    document.getElementById('qrContainer').classList.add('hidden');
    document.getElementById('encodedCaption').classList.add('hidden');
    document.getElementById('downloadBtn').classList.add('hidden');
  }

  function generateCode(){
    clearError();
    const input = document.getElementById('inputValue').value.trim();
    const placeholder = document.getElementById('placeholder');
    const barcodeCanvas = document.getElementById('barcodeCanvas');
    const qrContainer = document.getElementById('qrContainer');
    const caption = document.getElementById('encodedCaption');
    const downloadBtn = document.getElementById('downloadBtn');

    if(!input){
      showError('Silakan masukkan data terlebih dahulu.');
      return;
    }

    placeholder.classList.add('hidden');

    if(currentType === 'barcode'){
      barcodeCanvas.classList.remove('hidden');
      qrContainer.classList.add('hidden');
      try{
        JsBarcode(barcodeCanvas, input, {
          format: "CODE128",
          lineColor: "#000",
          background: "#ffffff",
          width: 2,
          height: 100,
          displayValue: true
        });
        showCaption(caption, input);
        downloadBtn.classList.remove('hidden');
      }catch(e){
        resetOutput();
        showError('Data tidak valid untuk format Barcode ini. Gunakan huruf, angka, atau simbol standar.');
      }
    }else{
      barcodeCanvas.classList.add('hidden');
      qrContainer.classList.remove('hidden');
      qrContainer.innerHTML = '';
      try{
        // Encode as UTF-8 bytes so QRCode.js reads non-ASCII text correctly
        const safeText = unescape(encodeURIComponent(input));
        new QRCode(qrContainer, {
          text: safeText,
          width: 200,
          height: 200,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
        showCaption(caption, input);
        setTimeout(() => downloadBtn.classList.remove('hidden'), 80);
      }catch(e){
        resetOutput();
        showError('Gagal membuat QR Code. Silakan coba lagi.');
      }
    }
  }

  function showCaption(caption, text){
    caption.textContent = text.length > 46 ? text.slice(0, 46) + '…' : text;
    caption.classList.remove('hidden');
  }

  function downloadCode(){
    const input = document.getElementById('inputValue').value.trim();
    const safeName = input.replace(/[^a-z0-9]/gi, '_').toLowerCase().substring(0, 20) || 'code';
    const filename = `${currentType}_${safeName}.png`;
    let dataUrl = '';

    if(currentType === 'barcode'){
      dataUrl = document.getElementById('barcodeCanvas').toDataURL('image/png');
    }else{
      const qrContainer = document.getElementById('qrContainer');
      const img = qrContainer.querySelector('img');
      const canvas = qrContainer.querySelector('canvas');
      if(img && img.src && img.src.startsWith('data:image')){
        dataUrl = img.src;
      }else if(canvas){
        dataUrl = canvas.toDataURL('image/png');
      }else{
        showError('Gambar QR Code belum siap, silakan coba lagi.');
        return;
      }
    }

    if(!dataUrl) return;
    const link = document.createElement('a');
    link.href = dataUrl;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  document.getElementById('inputValue').addEventListener('keydown', function(e){
    if(e.key === 'Enter') generateCode();
  });
</script>
</body>
</html>
